<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>X投稿 → ChatGPT</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <header>
    <h1>X投稿 → ChatGPT</h1>
    <p class="hint">ChatGPTアプリは「Chat」タブで開いておいてください。</p>
  </header>

  <main>
    <section class="meta">
      <div id="author" class="author"></div>
      <div class="sub">
        <span id="datetime"></span>
        <a id="link" href="#" target="_blank" rel="noreferrer"></a>
      </div>
    </section>

    <section class="post">
      <pre id="text"></pre>
    </section>

    <details id="quoted-section" class="block" hidden>
      <summary>引用ポスト</summary>
      <pre id="quoted"></pre>
    </details>

    <details id="replies-section" class="block" hidden>
      <summary>表示中のリプライ <span id="replies-count"></span></summary>
      <div id="replies"></div>
    </details>

    <section id="images-section" class="block" hidden>
      <h2>画像</h2>
      <div id="images"></div>
    </section>

    <details class="block">
      <summary>テンプレート</summary>
      <textarea id="template" spellcheck="false"></textarea>
    </details>

    <section class="prompt-block">
      <h2>送るプロンプト</h2>
      <textarea id="prompt" spellcheck="false"></textarea>
      <p id="note" class="note"></p>
    </section>
  </main>

  <footer>
    <button id="launch" class="primary">ChatGPTで開く</button>
    <button id="copy">プロンプトをコピー</button>
    <button id="close">閉じる</button>
  </footer>
  <div id="status" class="status" role="status"></div>

  <script src="ui.js"></script>
</body>
</html>
